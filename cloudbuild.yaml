# Cloud Build → Artifact Registry → Cloud Run (lekker-chat)
substitutions:
  _SERVICE_NAME: lekker-chat
  _REGION: europe-west1

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}/${_SERVICE_NAME}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}/${_SERVICE_NAME}:latest
      - -f
      - Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}/${_SERVICE_NAME}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --platform=managed
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}/${_SERVICE_NAME}:$SHORT_SHA
      - --region=${_REGION}
      # Keep ecosystem mail + GCS ADC aligned (do not use Replit Gmail/sidecar)
      - --update-secrets=INBOUND_API_KEY=INBOUND_API_KEY:latest
      - --update-env-vars=OBJECT_STORAGE_BACKEND=gcs,PRIVATE_OBJECT_DIR=/lekkernetworkbucket/lekker-chat/private,PUBLIC_OBJECT_SEARCH_PATHS=/lekkernetworkbucket/lekker-chat/public,SYSTEM_FROM_EMAIL=noreply@lekker.network,SYSTEM_FROM_NAME=Lekker Chat,SYSTEM_EMAIL_PROVIDER=auto,LEKKER_API_BASE_URL=https://lekker.network,CHAT_WHATSAPP_ONLY=true
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}/${_SERVICE_NAME}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}/${_SERVICE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
